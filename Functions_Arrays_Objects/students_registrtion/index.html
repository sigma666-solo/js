<!DOCTYPE html>
<html>
<head>
    <title>Регистрация студента</title>
</head>
<body>
    <form id="studentForm">
        <input id="name" type="text" placeholder="Имя" required>
        <input id="age" type="number" placeholder="Возраст" required>
        <input id="group" type="text" placeholder="Группа" required>
        <input id="average" type="number" step="0.1" placeholder="Средний балл" required>
        <button type="submit">Зарегистрировать</button>
    </form>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
